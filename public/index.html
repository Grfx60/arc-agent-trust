<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARC Agent Trust</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at top,
                    #07182b 0%,
                    #020b16 45%,
                    #01060d 100%
                );

            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;
        }

        .container {
            width: min(
                1400px,
                calc(100% - 48px)
            );

            margin: 0 auto;
        }

        /* ==========================================
           HEADER
        ========================================== */

        header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 30px;

            padding:
                28px
                0
                30px;
        }

        .brand {
            display: flex;

            align-items: center;

            gap: 18px;
        }

        .logo {
            width: 90px;
            height: 90px;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 18px
                    rgba(
                        0,
                        140,
                        255,
                        0.55
                    )
                );
        }

        .brand-title {
            font-size: 38px;

            font-weight: 800;

            letter-spacing: -1px;
        }

        .brand-subtitle {
            margin-top: 7px;

            color: #7da8d3;

            font-size: 16px;
        }

        .network {
            padding:
                12px
                18px;

            border:
                1px solid
                #21466c;

            border-radius: 30px;

            background:
                rgba(
                    4,
                    18,
                    34,
                    0.8
                );

            color: #8bb8df;

            font-size: 13px;

            white-space: nowrap;
        }

        .network-dot {
            display: inline-block;

            width: 10px;
            height: 10px;

            margin-right: 8px;

            border-radius: 50%;

            background: #31e77c;

            box-shadow:
                0 0 12px
                rgba(
                    49,
                    231,
                    124,
                    0.8
                );
        }

        .network strong {
            color: #35ed7f;
        }

        /* ==========================================
           SEARCH
        ========================================== */

        .search-panel {
            border:
                1px solid
                #1b456d;

            border-radius: 18px;

            background:
                rgba(
                    5,
                    20,
                    36,
                    0.72
                );

            padding: 26px;

            margin-bottom: 22px;
        }

        .search-title {
            color: #dcecff;

            font-size: 18px;

            margin-bottom: 12px;
        }

        .search-row {
            display: flex;

            gap: 14px;
        }

        #agentInput {
            flex: 1;

            min-width: 0;

            height: 62px;

            padding:
                0
                20px;

            border:
                1px solid
                #25557f;

            border-radius: 12px;

            outline: none;

            background:
                #020b15;

            color: #ffffff;

            font-size: 19px;

            font-weight: 700;
        }

        #agentInput:focus {
            border-color: #13a8ff;

            box-shadow:
                0 0 0 2px
                rgba(
                    19,
                    168,
                    255,
                    0.12
                );
        }

        #analyzeButton {
            height: 62px;

            min-width: 155px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #ffd63b,
                    #ffb900
                );

            color: #06101c;

            font-size: 17px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.15s,
                box-shadow 0.15s;
        }

        #analyzeButton:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 25px
                rgba(
                    255,
                    190,
                    20,
                    0.22
                );
        }

        #analyzeButton:disabled {
            opacity: 0.6;

            cursor: wait;

            transform: none;

            box-shadow: none;
        }

        .browse-row {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 16px;
        }

        .history-panel {
            display: none;

            margin-top: 18px;

            padding: 24px;

            border: 1px solid #17436a;

            border-radius: 16px;

            background: #04111e;
        }

        .history-panel.visible {
            display: block;
        }

        .history-title {
            margin: 0 0 18px;

            font-size: 20px;
        }

        .history-list {
            display: grid;

            gap: 10px;
        }

        .history-item {
            display: grid;

            grid-template-columns: 1.4fr repeat(3, 1fr);

            gap: 12px;

            align-items: center;

            padding: 13px 15px;

            border: 1px solid #173e61;

            border-radius: 10px;

            background: #061321;

            color: #8eb6db;

            font-size: 12px;
        }

        .history-item strong {
            color: #ffffff;
        }

        .compare-panel,
        .detail-panel {
            display: none;

            margin-top: 18px;

            padding: 24px;

            border: 1px solid #17436a;

            border-radius: 16px;

            background: #04111e;
        }

        .compare-panel.visible,
        .detail-panel.visible {
            display: block;
        }

        .compare-row {
            display: flex;

            gap: 10px;

            margin-top: 14px;
        }

        #compareInput {
            flex: 1;

            min-width: 0;

            height: 46px;

            padding: 0 14px;

            border: 1px solid #25557f;

            border-radius: 10px;

            outline: none;

            background: #020b15;

            color: #ffffff;

            font-size: 15px;
        }

        #compareButton {
            height: 46px;

            padding: 0 18px;

            border: 1px solid #12649b;

            border-radius: 10px;

            background: #061727;

            color: #16b7ff;

            font-weight: 700;

            cursor: pointer;
        }

        .comparison-grid {
            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));

            gap: 10px;
        }

        .comparison-card,
        .evidence-detail,
        .trend-row {
            padding: 13px 15px;

            border: 1px solid #173e61;

            border-radius: 10px;

            background: #061321;
        }

        .comparison-card strong,
        .evidence-detail strong,
        .trend-row strong {
            color: #ffffff;
        }

        .evidence-detail,
        .trend-row {
            display: flex;

            justify-content: space-between;

            gap: 12px;

            margin-bottom: 8px;

            color: #8eb6db;

            font-size: 12px;
        }

        .status-positive {
            color: #39e97e;
        }

        .status-negative {
            color: #ff5757;
        }

        .status-unknown {
            color: #ffc52e;
        }

        .graph-summary {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 8px;

            margin-bottom: 14px;
        }

        .graph-stat {
            padding: 12px;

            border: 1px solid #173e61;

            border-radius: 9px;

            background: #061321;

            color: #8eb6db;

            font-size: 11px;
        }

        .graph-stat strong {
            display: block;

            margin-top: 5px;

            color: #ffffff;

            font-size: 18px;
        }

        .graph-risk-high {
            color: #ff5757 !important;
        }

        .graph-edge {
            display: flex;

            justify-content: space-between;

            gap: 10px;

            padding: 10px 12px;

            border-bottom: 1px solid #173a5b;

            color: #8eb6db;

            font-size: 11px;
        }

        .decision-summary {
            margin-top: 18px;

            padding: 18px;

            border-left: 3px solid #18adff;

            border-radius: 0 10px 10px 0;

            background: rgba(8, 35, 57, 0.55);
        }

        .decision-summary-title {
            margin-bottom: 10px;

            color: #ffffff;

            font-weight: 800;
        }

        .decision-summary ul {
            margin: 0;

            padding-left: 18px;

            color: #8eb6db;

            font-size: 13px;

            line-height: 1.7;
        }

        .freshness {
            margin-top: 10px;

            color: #759bc1;

            font-size: 11px;
        }

        .source-grid {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 8px;
        }

        .source-item {
            padding: 12px;

            border: 1px solid #173e61;

            border-radius: 9px;

            background: #061321;

            color: #8eb6db;

            font-size: 11px;
        }

        .source-item strong {
            display: block;

            margin-top: 5px;

            color: #39e97e;

            font-size: 12px;
        }

        .source-item .source-unknown {
            color: #ffc52e;
        }

        @media (max-width: 650px) {
            .source-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 650px) {
            .graph-summary {
                grid-template-columns: 1fr 1fr;
            }
        }

        #browseButton,
        #historyButton {
            padding:
                12px
                25px;

            border:
                1px solid
                #12649b;

            border-radius: 11px;

            background:
                #061727;

            color: #16b7ff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        #browseButton:hover,
        #historyButton:hover,
        #networkButton:hover {
            background: #09233a;
        }

        #networkButton {
            padding: 12px 18px;

            border: 1px solid #12649b;

            border-radius: 11px;

            background: #061727;

            color: #16b7ff;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;
        }

        @media (max-width: 650px) {
            .history-item {
                grid-template-columns: 1fr 1fr;
            }

            .compare-row {
                flex-direction: column;
            }

            #compareButton {
                width: 100%;
            }
        }

        /* ==========================================
           MESSAGE
        ========================================== */

        #message {
            margin-bottom: 22px;
        }

        .loading {
            padding: 45px;

            text-align: center;

            border:
                1px solid
                #1a456c;

            border-radius: 18px;

            background:
                rgba(
                    5,
                    20,
                    36,
                    0.75
                );
        }

        .spinner {
            width: 35px;
            height: 35px;

            margin:
                0
                auto
                18px;

            border:
                3px solid
                #17334f;

            border-top-color:
                #18adff;

            border-radius: 50%;

            animation:
                spin
                0.8s
                linear
                infinite;
        }

        @keyframes spin {

            to {
                transform:
                    rotate(360deg);
            }

        }

        .loading strong {
            font-size: 19px;
        }

        .loading span {
            display: block;

            margin-top: 8px;

            color: #759bc1;
        }

        .error {
            padding: 25px;

            border:
                1px solid
                #725313;

            border-radius: 16px;

            background:
                rgba(
                    36,
                    24,
                    5,
                    0.85
                );

            color: #ffc52e;

            text-align: center;
        }

        .error strong {
            display: block;

            margin-bottom: 8px;

            font-size: 19px;
        }

        /* ==========================================
           LIVE RESULT
        ========================================== */

        .dashboard {
            border:
                1px solid
                #173f65;

            border-radius: 18px;

            background:
                rgba(
                    3,
                    14,
                    26,
                    0.82
                );

            padding: 26px;
        }

        .result-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding-bottom: 24px;

            border-bottom:
                1px solid
                #163653;
        }

        .result-actions {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 18px;
        }

        .result-action {
            padding: 9px 12px;

            border: 1px solid #25557f;

            border-radius: 9px;

            background: #061727;

            color: #8ed8ff;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;
        }

        .result-action:hover {
            background: #09233a;

            border-color: #18adff;
        }

        @media print {
            body {
                background: #ffffff;

                color: #111111;
            }

            .search-panel,
            .history-panel,
            .compare-panel,
            .browse-panel,
            footer,
            .result-actions {
                display: none !important;
            }

            .dashboard,
            .panel,
            .score-card {
                background: #ffffff !important;

                color: #111111 !important;

                border-color: #cccccc !important;
            }
        }

        .live-label {
            color: #19b5ff;

            font-size: 12px;

            letter-spacing: 2px;

            margin-bottom: 8px;
        }

        .agent-title {
            margin: 0;

            font-size: 30px;
        }

        .agent-network {
            margin-top: 7px;

            color: #759bc1;

            font-size: 14px;
        }

        .decision {
            padding:
                13px
                22px;

            border-radius: 12px;

            font-size: 21px;

            font-weight: 900;
        }

        .decision-trust {
            color: #36ed7f;

            background:
                rgba(
                    20,
                    100,
                    55,
                    0.16
                );

            border:
                1px solid
                #217c4c;
        }

        .decision-review {
            color: #ffc52e;

            background:
                rgba(
                    120,
                    90,
                    10,
                    0.16
                );

            border:
                1px solid
                #806314;
        }

        .decision-risk {
            color: #ff5555;

            background:
                rgba(
                    130,
                    20,
                    20,
                    0.16
                );

            border:
                1px solid
                #7d2828;
        }

        /* ==========================================
           SCORE CARDS
        ========================================== */

        .score-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    1fr
                );

            gap: 14px;

            margin-top: 22px;
        }

        .score-card {
            padding: 22px;

            border:
                1px solid
                #1a456b;

            border-radius: 13px;

            background:
                #04111e;
        }

        .score-label {
            color: #759cc3;

            font-size: 11px;

            letter-spacing: 1.3px;

            margin-bottom: 10px;
        }

        .score-value {
            font-size: 31px;

            font-weight: 900;
        }

        .trust-value {
            color: #42e77e;
        }

        .risk-value {
            color: #ffb71b;
        }

        .confidence-value {
            color: #219fff;
        }

        .coverage-value {
            color: #42e77e;
        }

        /* ==========================================
           EVIDENCE
        ========================================== */

        .section-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 15px;

            margin-top: 18px;
        }

        .panel {
            padding: 22px;

            border:
                1px solid
                #173f64;

            border-radius: 14px;

            background:
                #04111e;
        }

        .panel-title {
            margin-bottom: 18px;

            font-size: 16px;

            font-weight: 800;
        }

        .evidence-row {
            margin-bottom: 15px;
        }

        .evidence-top {
            display: flex;

            justify-content: space-between;

            margin-bottom: 7px;

            color: #8db4d8;

            font-size: 12px;
        }

        .bar {
            height: 6px;

            overflow: hidden;

            border-radius: 10px;

            background:
                #13283d;
        }

        .bar-fill {
            height: 100%;

            border-radius: 10px;

            background:
                #31df76;
        }

        .bar-yellow {
            background:
                #ffbd25;
        }

        .bar-orange {
            background:
                #ff7c2b;
        }

        .bar-red {
            background:
                #ff4c4c;
        }

        /* ==========================================
           STATUS
        ========================================== */

        .status-list {
            display: grid;

            gap: 9px;
        }

        .status-row {
            display: flex;

            justify-content: space-between;

            align-items: center;

            padding:
                12px
                14px;

            border:
                1px solid
                #173a5b;

            border-radius: 8px;

            background:
                #061321;
        }

        .status-name {
            color: #8eb6db;

            font-size: 13px;
        }

        .status-value {
            color: #39e97e;

            font-size: 12px;

            font-weight: 800;
        }

        .status-unknown {
            color: #ffc52e;
        }

        .status-negative {
            color: #ff5757;
        }

        /* ==========================================
           SAFETY
        ========================================== */

        .safety {
            margin-top: 18px;
        }

        /* ==========================================
           INFO
        ========================================== */

        .info {
            margin-top: 18px;

            padding: 20px;

            border-left:
                3px solid
                #18adff;

            border-radius:
                0
                10px
                10px
                0;

            background:
                rgba(
                    8,
                    35,
                    57,
                    0.55
                );
        }

        .info strong {
            color: #ffffff;
        }

        .info p {
            margin:
                8px
                0
                0;

            color: #82a8ce;

            font-size: 13px;

            line-height: 1.6;
        }

        /* ==========================================
           BROWSE
        ========================================== */

        .browse-panel {
            display: none;

            margin-top: 18px;

            padding: 24px;

            border:
                1px solid
                #17436a;

            border-radius: 16px;

            background:
                #04111e;
        }

        .browse-panel.visible {
            display: block;
        }

        .browse-title {
            margin: 0 0 18px;

            font-size: 20px;
        }

        #archiveSearch {
            width: 100%;

            height: 42px;

            margin-bottom: 14px;

            padding: 0 13px;

            border: 1px solid #25557f;

            border-radius: 9px;

            outline: none;

            background: #020b15;

            color: #ffffff;
        }

        .agent-list {
            display: grid;

            grid-template-columns:
                repeat(
                    2,
                    1fr
                );

            gap: 10px;

            max-height: 500px;

            overflow-y: auto;
        }

        .agent-item {
            padding: 15px;

            border:
                1px solid
                #173e61;

            border-radius: 10px;

            background:
                #061321;

            cursor: pointer;
        }

        .agent-item:hover {
            border-color:
                #1baaff;

            background:
                #092039;
        }

        .agent-id {
            color: #19b5ff;

            font-weight: 800;
        }

        .agent-name {
            margin-top: 5px;

            color: #ffffff;

            font-size: 13px;
        }

        .agent-owner {
            margin-top: 5px;

            color: #6489ae;

            font-size: 11px;
        }

        .archive-meta {
            display: flex;

            justify-content: space-between;

            gap: 8px;

            margin-top: 8px;

            color: #759bc1;

            font-size: 11px;
        }

        .archive-decision {
            color: #ffc52e;

            font-weight: 800;
        }

        /* ==========================================
           FOOTER
        ========================================== */

        footer {
            padding:
                28px
                0
                35px;

            text-align: center;

            color: #456b91;

            font-size: 12px;
        }

        /* ==========================================
           RESPONSIVE
        ========================================== */

        @media (
            max-width: 900px
        ) {

            .score-grid {
                grid-template-columns:
                    repeat(
                        2,
                        1fr
                    );
            }

            .section-grid {
                grid-template-columns:
                    1fr;
            }

            .agent-list {
                grid-template-columns:
                    1fr;
            }

        }

        @media (
            max-width: 650px
        ) {

            .container {
                width:
                    calc(
                        100% - 24px
                    );
            }

            header {
                align-items:
                    flex-start;

                flex-direction:
                    column;
            }

            .network {
                align-self:
                    flex-start;
            }

            .brand-title {
                font-size: 28px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            .search-row {
                flex-direction:
                    column;
            }

            #analyzeButton {
                width: 100%;
            }

            .score-grid {
                grid-template-columns:
                    1fr;
            }

            .result-header {
                flex-direction:
                    column;

                align-items:
                    flex-start;
            }

        }

    </style>
</head>


<body>

<div class="container">


    <!-- ==========================================
         HEADER
    ========================================== -->

    <header>

        <div class="brand">

            <img
                src="/logo.png"
                class="logo"
                alt="ARC Agent Trust"
            >

            <div>

                <div class="brand-title">
                    ARC Agent Trust
                </div>

                <div class="brand-subtitle">
                    Evidence-based agent trust analysis
                </div>

            </div>

        </div>


        <div class="network">

            <span class="network-dot"></span>

            <strong>
                ARC TESTNET
            </strong>

            &nbsp;•&nbsp;

            LOCAL ENGINE

        </div>

    </header>


    <!-- ==========================================
         SEARCH
    ========================================== -->

    <section class="search-panel">

        <div class="search-title">
            Analyze an Agent
        </div>


        <div class="search-row">

            <input
                id="agentInput"
                value="887060"
                placeholder="Enter Agent ID"
                autocomplete="off"
            >


            <button
                id="analyzeButton"
                onclick="analyzeAgent()"
            >
                🛡 Analyze
            </button>

        </div>


        <div class="browse-row">

            <button
                id="browseButton"
                onclick="browseAgents()"
            >
                🔎 Browse Agents
            </button>

            <button
                id="networkButton"
                onclick="browseNetworkAgents()"
            >
                🌐 Arc Network
            </button>

            <button
                id="historyButton"
                onclick="showHistory()"
            >
                🕘 History
            </button>

        </div>

        <div class="compare-row">

            <input
                id="compareInput"
                value="845265,887060"
                placeholder="Agent IDs, comma separated"
                autocomplete="off"
            >

            <button
                id="compareButton"
                onclick="compareSelectedAgents()"
            >
                Compare Agents
            </button>

        </div>

    </section>

    <section
        id="historyPanel"
        class="history-panel"
    >

        <h3 class="history-title">
            Analysis History
        </h3>

        <div
            id="historyList"
            class="history-list"
        ></div>

    </section>

    <section
        id="comparePanel"
        class="compare-panel"
    >

        <h3 class="history-title">
            Agent Comparison
        </h3>

        <div

<script>

/*
==================================================
CONFIGURATION
==================================================
*/

let lastAnalysisData = null;
let networkArchivePage = 1;

/*
==================================================
ENTER KEY
==================================================
*/

document
    .getElementById("agentInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                analyzeAgent();

            }

        }
    );


/*
==================================================
ANALYZE AGENT
==================================================
*/

async function analyzeAgent() {

    const input =
        document.getElementById(
            "agentInput"
        );

    const button =
        document.getElementById(
            "analyzeButton"
        );

    const message =
        document.getElementById(
            "message"
        );

    const agentId =
        input.value.trim();


    if (!agentId) {

        showError(
            "Please enter an Agent ID."
        );

        return;

    }


    if (
        !/^\d+$/.test(agentId)
    ) {

        showError(
            "Agent ID must contain numbers only."
        );

        return;

    }


    button.disabled = true;


    message.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            <strong>
                Analyzing Agent #${agentId}
            </strong>

            <span>
                Reading live evidence from Arc Testnet...
            </span>

        </div>

    `;


    try {

        const response =
            await fetch(
                 `/api/live-agent?id=${encodeURIComponent(agentId)}`,
                 {
                     method: "GET",
                     cache: "no-store"
            }
       );


        let data = {};

        try {

            data =
                await response.json();

        } catch {

            data = {};

        }


        if (!response.ok) {

            showError(
                data.details ||
                data.error ||
                "Live analysis failed."
            );

            return;

        }


        renderResult(
            data
        );

    } catch (error) {

        showError(
            "Could not connect to the Live Engine on port 3100. Make sure the live API is running."
        );

    } finally {

        button.disabled = false;

    }

}


/*
==================================================
ERROR
==================================================
*/

function showError(text) {

    document
        .getElementById("message")
        .innerHTML = `

            <div class="error">

                <strong>
                    Live Analysis Failed
                </strong>

                ${escapeHtml(text)}

            </div>

        `;

}


/*
==================================================
RESULT
==================================================
*/

    const identity =

    const evidenceItems =

    message.innerHTML = `

            <div class="decision-summary">

                </div>

            <!-- SCORES -->

            <!-- EVIDENCE BARS -->

            </div>


            <!-- EXPLAINABILITY -->

            <div class="section-grid">

                <div class="panel">

                    <div class="panel-title">

                    <div class="detail-list">

                    </div>

                </div>


                <div class="panel">

                    <div class="panel-title">

                    </div>

                    <div id="trendList">

            <!-- GRAPH INTELLIGENCE -->

                    "Manipulation",
                    getSafety(

                    )
                )}

                ${statusRow(
                    "Automatic ALLOW",
                    getSafety(
                        data,

                    )
                )}

                    getSafety(
                        data,

                )}

            </div>


            <!-- INFO -->

            <div class="info">

                <strong>
                    Live evidence analysis completed.

                    This assessment was generated

        </section>

    `;

    loadHistoryTrend(agentId);
    loadGraphData(agentId);

}


/*
==================================================
STATUS ROW
==================================================
*/

function statusRow(
    name,
    value
) {

    return `

        <div class="status-row">

            <span class="status-name">
                ${escapeHtml(name)}
            </span>

            <span class="status-value">
                ${escapeHtml(
                    String(value)
                )}
            </span>

        </div>

    `;

}


/*
==================================================
BAR
==================================================
*/

function bar(
    name,
    value,
    className
) {

    const safeValue =
        Math.max(
            0,
            Math.min(
                100,
                Number(value) || 0
            )
        );


    return `

        <div class="evidence-row">

            <div class="evidence-top">

                <span>
                    ${escapeHtml(name)}
                </span>

                <strong>
                    ${safeValue}/100
                </strong>

            </div>

            <div class="bar">

                <div
                    class="${className}"
                    style="
                        width:${safeValue}%;
                    "
                ></div>

            </div>

        </div>

    `;

}


/*
==================================================
STATUS NORMALIZER
==================================================
*/

function normalizeStatus(
    value
) {

    if (
        value &&
        typeof value === "object"
    ) {

        return Object.keys(value).length > 0
            ? "✓ CONFIRMED"
            : "? UNKNOWN";

    }

    if (
        value === "CONFIRMED" ||
        value === "RESOLVED" ||
        value === true
    ) {

        return "✓ CONFIRMED";

    }


    if (
        value === "UNKNOWN" ||
        value === "UNAVAILABLE" ||
        value === null ||
        value === undefined
    ) {

        return "? UNKNOWN";

    }


    return String(
        value
    );

}


/*
==================================================
SAFETY
==================================================
*/

function getSafety(
    data,
    key
) {

    const safety =
        data.safety ||
        {};


    const value =
        safety[key] ??
        data[key];


    if (
        value === undefined ||
        value === null
    ) {

        return "NOT ESTABLISHED";

    }


    if (
        value === false
    ) {

        return "NOT ESTABLISHED";

    }


    if (
        value === true
    ) {

        return "ESTABLISHED";

    }


    return String(
        value
    ).toUpperCase();

}


/*
==================================================
NUMBER HELPER
==================================================
*/

function getNumber(
    ...values
) {

    for (
        const value of values
    ) {

        if (
            value !== undefined &&
            value !== null &&
            value !== "" &&
            !Number.isNaN(
                Number(value)
            )
        ) {

            return Number(value);

        }

    }

    return 0;

}


function csvCell(
    value
) {
    return `"${String(value ?? "").replace(/"/g, '""')}"`;
}


function renderDecisionReasons(
    decision,
    confidence,
    coverage
) {
    const reasons = [];

    if (decision === "TRUST") {
        reasons.push("No verified adverse evidence was found.");
    } else if (decision === "HIGH_RISK") {
        reasons.push("Verified adverse evidence requires caution before use.");
    } else {
        reasons.push("The available evidence does not meet the strong-trust threshold.");
    }

    if (confidence < 70) {
        reasons.push(`Evidence confidence is ${confidence}/100.`);
    }

    if (coverage < 80) {
        reasons.push(`Evidence coverage is ${coverage}%, so some sources remain unknown.`);
    }

    if (reasons.length === 1 && decision === "TRUST") {
        reasons.push("Identity and supporting evidence are currently available.");
    }

    return reasons
        .map(reason => `<li>${escapeHtml(reason)}</li>`)
        .join("");
}


function sourceStatus(
    label,
    value
) {
    const available = value !== null && value !== undefined;
    const status = available ? "AVAILABLE" : "UNKNOWN";
    const className = available ? "" : "source-unknown";

    return `
        <div class="source-item">
            <span>${escapeHtml(label)}</span>
            <strong class="${className}">${status}</strong>
        </div>
    `;
}


function reportToCsv(
    data
) {
    const trust = data.trust || {};
    const rows = [
        ["Field", "Value"],
        ["Agent ID", data.agentId || data.agent || ""],
        ["Analyzed At", data.analyzedAt || ""],
        ["Decision", trust.decision || data.decision || ""],
        ["Trust Score", trust.score ?? data.trustScore ?? ""],
        ["Risk Score", trust.riskScore ?? data.riskScore ?? ""],
        ["Confidence", trust.confidence ?? data.confidence ?? ""],
        ["Evidence Coverage", trust.evidenceCoverage ?? data.evidenceCoverage ?? ""],
        [],
        ["Signal", "Status", "Weight"]
    ];

    for (const item of Array.isArray(data.evidence) ? data.evidence : []) {
        rows.push([
            item.signal || "",
            item.status || "UNKNOWN",
            item.weight ?? ""
        ]);
    }

    return rows
        .map(row => row.map(csvCell).join(","))
        .join("\n");
}


function downloadReport(
    format
) {
    if (!lastAnalysisData) {
        showError("Analyze an agent before downloading a report.");
        return;
    }

    const agentId = lastAnalysisData.agentId || lastAnalysisData.agent || "agent";
    const isCsv = format === "csv";
    const content = isCsv
        ? reportToCsv(lastAnalysisData)
        : JSON.stringify(lastAnalysisData, null, 2);
    const blob = new Blob([content], {
        type: isCsv ? "text/csv;charset=utf-8" : "application/json;charset=utf-8"
    });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `arc-agent-trust-${agentId}.${isCsv ? "csv" : "json"}`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
}


function renderEvidenceDetails(
    evidenceItems
) {
    if (evidenceItems.length === 0) {
        return "<div class=\"error\">No evidence details available.</div>";
    }

    return evidenceItems
        .map(item => {
            const status = String(item?.status || "UNKNOWN");
            const statusClass = status === "POSITIVE"
                ? "status-positive"
                : status === "NEGATIVE"
                    ? "status-negative"
                    : "status-unknown";

            return `
                <div class="evidence-detail">
                    <span>${escapeHtml(item?.signal || "Unknown signal")}</span>
                    <strong class="${statusClass}">
                        ${escapeHtml(status)} · ${escapeHtml(String(item?.weight ?? 0))}
                    </strong>
                </div>
            `;
        })
        .join("");
}


async function loadHistoryTrend(
    agentId
) {
    const trendList = document.getElementById("trendList");
    if (!trendList) return;

    try {
        const response = await fetch(
            `/api/history?id=${encodeURIComponent(agentId)}`,
            { cache: "no-store" }
        );
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not load trend data.");
        }

        const reports = Array.isArray(data.reports) ? data.reports.slice(0, 6) : [];
        if (reports.length === 0) {
            trendList.innerHTML = "<div class=\"error\">No trend data available.</div>";
            return;
        }

        trendList.innerHTML = reports.map(report => `
            <div class="trend-row">
                <span>${escapeHtml(new Date(report.analyzedAt).toLocaleDateString())}</span>
                <span>${escapeHtml(report.decision || "UNKNOWN")}</span>
                <strong>Risk ${escapeHtml(String(report.riskScore ?? "—"))}</strong>
            </div>
        `).join("");
    } catch (error) {
        trendList.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    }
}


async function loadGraphData(
    agentId
) {
    const graphContent = document.getElementById("graphContent");
    if (!graphContent) return;

    try {
        const response = await fetch(
            `/api/graph?id=${encodeURIComponent(agentId)}`,
            { cache: "no-store" }
        );
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "No graph data available.");
        }

        const riskClass = data.graphRisk === "HIGH"
            ? "graph-risk-high"
            : "";
        const edges = Array.isArray(data.edges) ? data.edges.slice(0, 8) : [];

        graphContent.innerHTML = `
            <div class="graph-summary">
                <div class="graph-stat">Nodes<strong>${escapeHtml(String(data.nodeCount))}</strong></div>
                <div class="graph-stat">Edges<strong>${escapeHtml(String(data.edgeCount))}</strong></div>
                <div class="graph-stat">Providers<strong>${escapeHtml(String(data.reputationProviderCount))}</strong></div>
                <div class="graph-stat">Graph risk<strong class="${riskClass}">${escapeHtml(data.graphRisk)}</strong></div>
            </div>
            <div class="freshness">
                Source: ${escapeHtml(data.source || "UNKNOWN")} · ${escapeHtml(data.generatedAt || "timestamp unavailable")}
            </div>
            ${data.overlapCount > 0 ? `
                <div class="error">
                    ${escapeHtml(String(data.overlapCount))} actor overlap(s) detected between reputation and validation.
                </div>
            ` : ""}
            <div>
                ${edges.length === 0
                    ? "<div class=\"error\">No graph relationships available.</div>"
                    : edges.map(edge => `
                        <div class="graph-edge">
                            <span>${escapeHtml(edge.type || "RELATIONSHIP")}</span>
                            <strong>${escapeHtml(String(edge.from || ""))} → ${escapeHtml(String(edge.to || ""))}</strong>
                        </div>
                    `).join("")}
            </div>
        `;
    } catch (error) {
        graphContent.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    }
}


async function compareSelectedAgents() {
    const input = document.getElementById("compareInput");
    const panel = document.getElementById("comparePanel");
    const list = document.getElementById("compareList");
    const ids = input.value
        .split(",")
        .map(value => value.trim())
        .filter(Boolean);

    if (ids.length < 2 || ids.some(id => !/^\d+$/.test(id))) {
        showError("Enter at least two numeric Agent IDs separated by commas.");
        return;
    }

    panel.classList.add("visible");
    list.innerHTML = "<div class=\"loading\">Comparing agents...</div>";

    try {
        const response = await fetch(
            `/api/compare?ids=${encodeURIComponent(ids.join(","))}`,
            { cache: "no-store" }
        );
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not compare agents.");
        }

        list.innerHTML = data.agents.map(agent => {
            const latest = agent.latest;
            if (!latest) {
                return `
                    <div class="comparison-card">
                        <strong>Agent #${escapeHtml(agent.agentId)}</strong>
                        <p>No saved report</p>
                    </div>
                `;
            }

            return `
                <div class="comparison-card">
                    <strong>Agent #${escapeHtml(agent.agentId)}</strong>
                    ${statusRow("Decision", latest.decision)}
                    ${statusRow("Trust", latest.trustScore ?? "—")}
                    ${statusRow("Risk", latest.riskScore ?? "—")}
                    ${statusRow("Confidence", latest.confidence ?? "—")}
                </div>
            `;
        }).join("");
    } catch (error) {
        list.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    }
}


/*
==================================================
BROWSE AGENTS
==================================================
*/

async function browseAgents(query = null) {

    const panel =
        document.getElementById(
            "browsePanel"
        );

    const list =
        document.getElementById(
            "agentList"
        );


    if (
        query === null &&
        panel.classList.contains(
            "visible"
        )
    ) {

        panel.classList.remove(
            "visible"
        );

        return;

    }


    panel.classList.add(
        "visible"
    );

    const searchQuery = query === null
        ? ""
        : String(query).trim();


    list.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading archived agents...

        </div>

    `;


    try {

        const response =
            await fetch(
                `/api/agents?q=${encodeURIComponent(searchQuery)}`,
                {
                    cache: "no-store"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Could not load agents."
            );

        }


        const data =
            await response.json();


        const agents =
            Array.isArray(data)
                ? data
                : data.agents || [];


        if (
            agents.length === 0
        ) {

            list.innerHTML = `

                <div class="error">

                    No agents available.

                </div>

            `;

            return;

        }


        list.innerHTML =
            agents
                .map(
                    agent => `

                        <div
                            class="agent-item"
                            onclick="
                                selectAgent(
                                    '${escapeHtml(
                                        String(
                                            agent.agentId ||
                                            ""
                                        )
                                    )}'
                                )
                            "
                        >

                            <div class="agent-id">

                                #${escapeHtml(
                                    String(
                                        agent.agentId ||
                                        ""
                                    )
                                )}

                            </div>


                            <div class="agent-name">

                                ${escapeHtml(
                                    agent.name ||
                                    "Unnamed Agent"
                                )}

                            </div>


                            <div class="archive-meta">
                                <span>${escapeHtml(String(agent.reportCount || 0))} report(s)</span>
                                <span class="archive-decision">
                                    ${escapeHtml(agent.latest?.decision || "UNKNOWN")}
                                </span>
                            </div>

                        </div>

                    `
                )
                .join("");


    } catch (error) {

        list.innerHTML = `

            <div class="error">

                <strong>
                    Browse Agents unavailable
                </strong>

                <br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


async function browseNetworkAgents(page = 1) {
    const panel = document.getElementById("browsePanel");
    const list = document.getElementById("agentList");
    const title = document.getElementById("archiveTitle");
    const paging = document.getElementById("archivePaging");
    const search = document.getElementById("archiveSearch");

    panel.classList.add("visible");
    networkArchivePage = page;
    title.textContent = "Arc Network Agent Catalog";
    search.value = "";
    list.innerHTML = "<div class=\"loading\">Scanning Arc Identity Registry...</div>";

    try {
        const response = await fetch(`/api/network-agents?refresh=1&page=${page}&limit=50`, {
            cache: "no-store"
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Network catalog unavailable.");

        if (data.agents.length === 0) {
            list.innerHTML = `
                <div class="error">
                    No agents found in the scanned range yet. Use Arc Network again to continue scanning.
                </div>
            `;
        } else {
            list.innerHTML = data.agents.map(agent => `
                <div class="agent-item" onclick="selectAgent('${escapeHtml(agent.agentId)}')">
                    <div class="agent-id">#${escapeHtml(agent.agentId)}</div>
                    <div class="agent-name">On-chain Agent</div>
                    <div class="agent-owner">${escapeHtml(agent.owner || "Owner unavailable")}</div>
                    <div class="archive-meta">
                        <span>Block ${escapeHtml(agent.registeredBlock || agent.lastTransferBlock || "—")}</span>
                        <span class="archive-decision">ACTIVE</span>
                    </div>
                </div>
            `).join("");
        }

        const totalPages = Math.max(1, Math.ceil(data.total / data.limit));
        paging.innerHTML = `
            <span>${data.complete ? "COMPLETE" : "PARTIAL SCAN"} · ${data.total} indexed · next block ${escapeHtml(data.nextBlock)}</span>
            <span>
                ${page > 1 ? `<button class="result-action" onclick="browseNetworkAgents(${page - 1})">Previous</button>` : ""}
                ${page < totalPages ? `<button class="result-action" onclick="browseNetworkAgents(${page + 1})">Next</button>` : ""}
            </span>
        `;
    } catch (error) {
        list.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
        paging.textContent = "Network scan unavailable";
    }
}


/*
==================================================
 ANALYSIS HISTORY
==================================================
*/

async function showHistory() {
    const agentId = document
        .getElementById("agentInput")
        .value
        .trim();

    const panel = document.getElementById("historyPanel");
    const list = document.getElementById("historyList");

    if (!/^\d+$/.test(agentId)) {
        showError("Please enter a valid Agent ID first.");
        return;
    }

    panel.classList.add("visible");
    list.innerHTML = "<div class=\"loading\">Loading analysis history...</div>";

    try {
        const response = await fetch(
            `/api/history?id=${encodeURIComponent(agentId)}`,
            { cache: "no-store" }
        );
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not load history.");
        }

        if (!data.reports || data.reports.length === 0) {
            list.innerHTML = "<div class=\"error\">No saved reports for this agent.</div>";
            return;
        }

        list.innerHTML = data.reports.map(report => `
            <div class="history-item">
                <span>${escapeHtml(new Date(report.analyzedAt).toLocaleString())}</span>
                <span>Decision <strong>${escapeHtml(report.decision)}</strong></span>
                <span>Risk <strong>${escapeHtml(String(report.riskScore ?? "—"))}</strong></span>
                <span>Confidence <strong>${escapeHtml(String(report.confidence ?? "—"))}</strong></span>
            </div>
        `).join("");
    } catch (error) {
        list.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    }
}


/*
==================================================
SELECT AGENT
==================================================
*/

function selectAgent(
    agentId
) {

    document
        .getElementById(
            "agentInput"
        )
        .value =
        agentId;


    document
        .getElementById(
            "browsePanel"
        )
        .classList.remove(
            "visible"
        );


    analyzeAgent();

}


/*
==================================================
HTML ESCAPE
==================================================
*/

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
